<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Career Application Form</title>

  <style>
    /* ===== General Page Styling ===== */
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    /* ===== Form Container ===== */
    .career-form {
      background-color: #fff;
      width: 100%;
      max-width: 450px;
      padding: 30px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .career-form:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .career-form h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #1e3a8a;
      font-size: 1.8rem;
    }

    /* ===== Input Fields ===== */
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #374151;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: 0.3s ease;
    }

    input:focus,
    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 5px rgba(99, 102, 241, 0.4);
    }

    /* ===== File Upload ===== */
    input[type="file"] {
      border: none;
      background-color: #f9fafb;
      padding: 8px 0;
      cursor: pointer;
    }

    /* ===== Button ===== */
    button {
      width: 100%;
      background-color: #4f46e5;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
      font-weight: 600;
    }

    button:hover {
      background-color: #4338ca;
    }

    /* ===== Success Message (optional) ===== */
    .success-message {
      text-align: center;
      color: #16a34a;
      font-weight: 600;
      margin-top: 20px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .career-form {
        padding: 25px;
      }

      .career-form h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <form
    class="career-form"
    action="https://formspree.io/f/xblpvepl"  
    method="POST"
    enctype="multipart/form-data"
  >
    <h2>Join the FAMJAM</h2>

    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your name" required />

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required />

    <label for="message">Why do you want to join us?</label>
    <textarea id="message" name="message" rows="4" placeholder="Write your message..." required></textarea>

    <label for="message">Would you rather be a teacher or a student?</label>
    <textarea id="message" name="message" rows="4" placeholder="Write your message..." required></textarea>

    <label for="message">On a scale of 10 how much of a crazy you are to create something?</label>
    <textarea id="message" name="message" rows="4" placeholder="Write your message..." required></textarea>

    

    <button type="submit">Submit Application</button>
  </form>

</body>
</html>
