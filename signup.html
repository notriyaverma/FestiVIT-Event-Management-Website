<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - festiVIT</title>
  <script src="https://cdn.tailwindcss.com"></script>
    
  <link href="style.css" rel="stylesheet"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@700&display=swap');

    body {
      background-color: #3f1a6f; /* Dark background */
      
    }
    .hidden-form {
      display: none;
    }


  </style>
</head>
<body class="bg-[#3f1a6f] flex flex-col items-center justify-center min-h-screen text-white">

  <!-- Container -->
  <div class="text-center space-y-8">
    <!-- Heading -->
    <h1 class="text-4xl sm:text-6xl font-bold fredoka text-xl text-[#00000] mb-2">Sign Up</h1>
    
    <!-- Login Text -->
    <p class="text-gray-200 text-sm sm:text-base">
      Already have an account? 
      <a href="login.html" class="text-pink-400 hover:underline">Login</a>
    </p>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button onclick="openForm('participant')" 
         class="px-8 py-4 bg-yellow-400 rounded-full text-lg font-semibold text-[#3f1a6f] hover:bg-yellow-300 transition">
        Participant
    </button>
      <button onclick="openForm('organizer')" 
         class="px-8 py-4 bg-yellow-400 rounded-full text-lg font-semibold text-[#3f1a6f] hover:bg-yellow-300 transition">
        Organizer
      </button>
    </div>
 <!-- Overlay -->
  <div id="overlay" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50">
    <div class="bg-yellow-400 rounded-2xl shadow-2xl p-10 w-[600px] max-w-[90%] space-y-6 relative">


    <!-- Close button -->
      <button type="button" onclick="closeForm()" class="absolute top-6 right-6 text-gray-500 hover:text-black text-4xl">
      &times;
      </button>


<!-- Participant Form -->
      <form id="participant-form" class="hidden bg-white text-black rounded-2xl p-8 space-y-4 shadow-2xl"
">
        <h2 class="text-xl font-bold text-[#3f1a6f] mb-2">PARTICIPANT</h2>
    
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input id="p-name" type="text" placeholder="Enter your name" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
      </div>
    
      <div >
        <label class="block text-sm font-medium text-gray-700">Registration Number</label>
        <input id="p-reg" type="text" placeholder="e.g. 21BCS1234" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
      </div>
      
      <div >
        <label class="block text-sm font-medium text-gray-700">College Email ID</label>
        <input id="p-email" type="email" placeholder="name@vitbhopal.ac.in" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
      </div>

      <div >
        <label class="block text-sm font-medium text-gray-700">Whatsapp/Phone Number</label>
        <input id="p-phone" type="tel" placeholder="91XXXXXXXX" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
      </div>
    
    
      <div class="flex justify-center mt-6">
        <button type="submit" class="bg-pink-300 text-white px-6 py-2 rounded-full hover:bg-[#3f1a6f] transition">
            Submit
        </button>
        </div>
    </form>

    <!-- Organizer Form -->
  <form id="organizer-form" class="hidden bg-white text-black rounded-2xl p-8 space-y-4 shadow-2xl"
">
    <h2 class="text-xl font-bold text-[#3f1a6f] mb-2">ORGANIZER</h2>
    
    <div>
      <label class="block text-sm font-medium text-gray-700">Club Name</label>
      <input id="o-club" type="text" placeholder="e.g. Coding Club" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
    </div>
    
    <div >
      <label class="block text-sm font-medium text-gray-700">Event Coordinator Name</label>
      <input id="o-coordinator" type="text" placeholder="Coordinator full name" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700">Faculty Coordinator Name</label>
      <input id="o-faculty" type="text" placeholder="Faculty full name" class="w-full px-3 py-2 border rounded-xl mt-1 text-black" required>
    </div>
    
    <div >
      <label class="block text-sm font-medium text-gray-700">Event Date</label>
      <input id="o-date" type="date" class="w-full px-3 py-2 border rounded-xl mt-1 text-gray-700" required>
    </div>
    
   
    <div class="flex justify-center mt-6">
        <button type="submit" class="bg-pink-300 text-white px-6 py-2 rounded-full hover:bg-[#3f1a6f] transition">
          Submit
        </button>
      </div>
  </form>
  </div>
  </div>

  <script>
  
  function openForm(type) {
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("participant-form").classList.add("hidden");
    document.getElementById("organizer-form").classList.add("hidden");
    document.getElementById(`${type}-form`).classList.remove("hidden");
  }

  function closeForm() {
    document.getElementById("overlay").classList.add("hidden");
  }

  // 🔹 Handle participant signup form submission
  document.getElementById("participant-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      role: "participant",
      name: document.querySelector("#p-name").value,
      regNo: document.querySelector("#p-reg").value,
      email: document.querySelector("#p-email").value,
      phone: document.querySelector("#p-phone").value,
    };

    try {
      const response = await fetch("http://localhost:3000/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      if (response.ok) {
        alert("Participant signup successful!");
        window.location.href = "pdashboard.html"; // redirect after success
      } else {
        alert("Error submitting participant form!");
      }
    } catch (err) {
      alert("❌ Error: " + err.message);
    }
  });

  // 🔹 Handle organizer signup form submission
  document.getElementById("organizer-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      role: "organizer",
      club: document.querySelector("#o-club").value,
      coordinator: document.querySelector("#o-coordinator").value,
      faculty: document.querySelector("#o-faculty").value,
      date: document.querySelector("#o-date").value,
    };

    try {
      const response = await fetch("http://localhost:3000/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      if (response.ok) {
        alert("Organizer signup successful!");
        window.location.href = "odashboard.html"; // redirect after success
      } else {
        alert("Error submitting organizer form!");
      }
    } catch (err) {
      alert("❌ Error: " + err.message);
    }
  });
</script>




</body>
</html>
